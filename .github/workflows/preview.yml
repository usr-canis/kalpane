name: Publish preview APK
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name, for example 0.2.0'
        required: true
        type: string
      notes:
        description: 'Release notes (Markdown)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore stable development signing key
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.PREVIEW_KEYSTORE_BASE64 }}
        run: |
          test -n "$PREVIEW_KEYSTORE_BASE64" || { echo 'Set PREVIEW_KEYSTORE_BASE64 to the existing preview development keystore.'; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
      - run: ./gradlew testDebugUnitTest lintDebug assemblePreview
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version }}
      - name: Prepare release assets
        run: |
          mkdir release-assets
          cp app/build/outputs/apk/preview/app-preview.apk "release-assets/kalpane-${{ inputs.version }}-preview.apk"
          cd release-assets && sha256sum *.apk > SHA256SUMS.txt
      - name: Remove development signing key from runner
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: preview-apk
          path: release-assets/
  publish:
    needs: preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: preview-apk
          path: release-assets
      - name: Create tag and prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          printf '%s\n\nDevelopment-signed preview. Installs alongside other builds as "dev.kalpane.preview".\n' "$NOTES" > notes.md
          gh release create "preview-v$VERSION" release-assets/* --target "$GITHUB_SHA" --prerelease \
            --title "Kalpane $VERSION (preview)" --notes-file notes.md
