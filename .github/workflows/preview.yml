name: Publish preview APK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing preview-v* tag to publish'
        required: true
        type: string
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore stable development signing key
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.PREVIEW_KEYSTORE_BASE64 }}
        run: |
          test -n "$PREVIEW_KEYSTORE_BASE64" || { echo 'Set PREVIEW_KEYSTORE_BASE64 to the existing preview development keystore. Do not replace it between updates.'; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
      - run: ./gradlew testDebugUnitTest lintDebug assemblePreview --stacktrace
        env:
          VERSION_CODE: ${{ github.run_number }}
      - name: Prepare release assets
        run: |
          mkdir release-assets
          cp app/build/outputs/apk/preview/app-preview.apk release-assets/kalpane-preview.apk
          cd release-assets
          sha256sum kalpane-preview.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: preview-apk
          path: release-assets/
      - name: Remove development signing key from runner
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          Path.home().joinpath('.android/debug.keystore').unlink(missing_ok=True)
          PY
  publish:
    if: startsWith(inputs.tag, 'preview-v')
    needs: preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: preview-apk
          path: release-assets
      - name: Publish development-signed prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --prerelease --verify-tag --title "Kalpane $RELEASE_TAG · Preview" --notes-file docs/PREVIEW_RELEASE.md
