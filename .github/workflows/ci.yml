name: Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test and lint
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest lintDebug assembleDebug --continue 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-and-debug-apk
          path: |
            app/build/reports/
            app/build/outputs/apk/debug/*.apk
      - name: Error summary
        if: failure()
        run: |
          grep -E '^e: |FAILED|Error:|error:|AssertionError|Exception' build.log | grep -v '^\s*at ' | head -40
  devices:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - form: phone
            profile: pixel_6
          - form: tablet
            profile: pixel_c
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          FORM: ${{ matrix.form }}
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: bash scripts/ci-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.form }}
          path: |
            app/build/screenshots/
            app/build/reports/androidTests/
  screenshots:
    # Publishes the latest screenshots to the ci-screenshots branch for review.
    needs: devices
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: screenshots-*
          path: shots
          merge-multiple: true
      - name: Push to ci-screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd shots
          git init -q
          git checkout -q -b ci-screenshots
          echo "Screenshots from ${GITHUB_SHA}" > README.md
          git add -A
          git -c user.name="github-actions" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
