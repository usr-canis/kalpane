name: Signed Android release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name, for example 0.1.0'
        required: true
        type: string
permissions:
  contents: read
jobs:
  signed-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate signing setup
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$SIGNING_STORE_PASSWORD" && test -n "$SIGNING_KEY_ALIAS" && test -n "$SIGNING_KEY_PASSWORD" || { echo 'Configure the four Android signing secrets in the release environment.'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kalpane.jks"
      - name: Test and build signed packages
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/kalpane.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          RELEASE_INPUT: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          export VERSION_NAME="${RELEASE_INPUT:-${RELEASE_REF#v}}"
          ./gradlew testDebugUnitTest lintRelease assembleRelease bundleRelease --stacktrace
      - name: Verify APK signature
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk"
      - name: Remove temporary signing key
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'kalpane.jks').unlink(missing_ok=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: signed-kalpane
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: signed-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-kalpane
          path: packages
      - name: Create reviewable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --draft --verify-tag --title "Kalpane $RELEASE_TAG" --generate-notes $(find packages -type f \( -name '*.apk' -o -name '*.aab' -o -name mapping.txt \))
