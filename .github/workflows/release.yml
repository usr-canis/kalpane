name: Release
# Builds the signed Play Store bundle (AAB) and APK, tags the commit and creates a draft
# GitHub release. With PLAY_SERVICE_ACCOUNT_JSON set, it also uploads to the Play internal track.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name, for example 1.0.0'
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: release
    outputs:
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - id: version
        run: echo "code=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
      - name: Restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$SIGNING_STORE_PASSWORD" && test -n "$SIGNING_KEY_ALIAS" && test -n "$SIGNING_KEY_PASSWORD" \
            || { echo 'Add the four ANDROID_* signing secrets to the release environment.'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
      - name: Test and build signed bundle and APK
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/upload.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ inputs.version }}
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease bundleRelease
      - name: Verify signature and 16 KB page alignment
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" verify app/build/outputs/apk/release/app-release.apk
          "$BT/zipalign" -c -P 16 -v 4 app/build/outputs/apk/release/app-release.apk | tail -3
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - name: Collect release files
        run: |
          mkdir release
          cp app/build/outputs/bundle/release/app-release.aab "release/kalpane-${{ inputs.version }}.aab"
          cp app/build/outputs/apk/release/app-release.apk "release/kalpane-${{ inputs.version }}.apk"
          cp app/build/outputs/mapping/release/mapping.txt "release/mapping-${{ inputs.version }}.txt"
          cd release && sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.version }}
          path: release/
  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ inputs.version }}
          path: release
      - name: Tag and draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" release/* --draft --target "$GITHUB_SHA" \
            --title "Kalpane ${{ inputs.version }}" --notes-file docs/play/release-notes.md
  play-internal:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ inputs.version }}
          path: release
      - name: Check for Play credentials
        id: play
        env:
          JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "enabled=$([ -n "$JSON" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Upload to Play internal testing
        if: steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.kalpane
          releaseFiles: release/kalpane-${{ inputs.version }}.aab
          mappingFile: release/mapping-${{ inputs.version }}.txt
          track: internal
          status: draft
